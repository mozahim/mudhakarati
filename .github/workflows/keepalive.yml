# Keeps the free Supabase database from being paused during long breaks
# (Supabase pauses free projects after about a week with little activity).
# It sends three tiny requests a day; if the database is ever paused, this
# run fails and GitHub emails you, so you know to press "Resume" in Supabase.
name: keep-database-awake

on:
  schedule:
    - cron: "23 5 * * *"   # every day at 05:23 UTC
  workflow_dispatch:        # "Run workflow" button for a manual check

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPA_URL: https://xemwgtlvfqqrjhjejgyk.supabase.co
          SUPA_KEY: sb_publishable_geCKDg0yiOaumtdr8U7ctA_la74Bu1F
        run: |
          for i in 1 2 3; do
            curl -fsS --retry 3 --retry-delay 10 -X POST "$SUPA_URL/rest/v1/rpc/app_ping" \
              -H "apikey: $SUPA_KEY" -H "Content-Type: application/json" -d '{}'
            echo
            sleep 15
          done

      - name: Check out the repository
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      # GitHub switches off scheduled workflows in repositories with no activity
      # for 60 days; one small commit a month prevents that.
      - name: Monthly heartbeat commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "heartbeat $(date -u +%Y-%m-%d)"
            git push
          fi
